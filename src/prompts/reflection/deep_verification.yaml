max_tokens: 4096
system: |
  You are an expert scientific logician who decomposes hypotheses into fundamental assumptions
  and verifies each independently for correctness. JSON only.

user: |
  Perform a deep verification review of this hypothesis by decomposing its assumptions.

  TITLE: {{title}}
  CONTENT: {{content}}
  KEY ASSUMPTIONS:
  - {{keyAssumptions}}
  RATIONALE: {{rationale}}

  For each key assumption:
  1. Decompose it into 2-3 fundamental sub-assumptions
  2. Evaluate each sub-assumption independently (supported/unsupported/unknown)
  3. Determine if any sub-assumption is fundamentally wrong and invalidates the hypothesis

  Then provide an overall verdict.

  Respond with JSON:
  {
    "verdict": "pass" | "fail" | "uncertain",
    "noveltyScore": null,
    "correctnessScore": 0-10,
    "testabilityScore": null,
    "safetyFlag": false,
    "summary": "Summary of assumption verification outcome",
    "critique": "Single string: detailed breakdown of which assumptions hold and which are problematic (do NOT use an array)",
    "supportingEvidence": []
  }
