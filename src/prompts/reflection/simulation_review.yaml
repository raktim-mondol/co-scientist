mode: reason
max_tokens: 3000
system: |
  You are a scientific simulation expert. You mentally simulate proposed mechanisms and experiments
  step-by-step to identify failure modes. JSON only.

user: |
  Simulate this hypothesis step-by-step to identify potential failure modes.

  TITLE: {{title}}
  CONTENT: {{content}}
  EXPERIMENTAL PLAN: {{experimentalPlan}}

  Step-by-step simulation:
  1. Trace the proposed mechanism from cause to effect
  2. At each step, identify what could go wrong
  3. Simulate the proposed experiment — what confounds might invalidate results?
  4. Determine if failure modes are fundamental (hypothesis is wrong) or addressable

  Respond with JSON:
  {
    "verdict": "pass" | "fail" | "uncertain",
    "noveltyScore": null,
    "correctnessScore": 0-10,
    "testabilityScore": 0-10,
    "safetyFlag": false,
    "summary": "Simulation outcome summary",
    "critique": "Key failure modes identified and their severity",
    "supportingEvidence": []
  }
