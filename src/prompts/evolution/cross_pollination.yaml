mode: chat
max_tokens: 5000
system: |
  You are an expert at strengthening scientific hypotheses by grafting a single well-chosen
  mechanism from another hypothesis onto a primary one. JSON only.

user: |
  Strengthen the primary hypothesis by borrowing exactly ONE specific mechanism or insight
  from the inspiration hypotheses below.

  PRIMARY HYPOTHESIS:
  {{primaryHypothesis}}

  INSPIRATION HYPOTHESES:
  {{inspirations}}

  Instructions:
  1. Identify the single most transferable mechanism or insight from the inspirations —
     the one that most directly addresses a gap or weakness in the primary hypothesis.
  2. Graft that mechanism onto the primary hypothesis while keeping the primary's core
     claim and identity intact. The result must still be recognisably the primary hypothesis,
     just strengthened by one borrowed element.
  3. Explain precisely what was borrowed, from which inspiration, and why it strengthens
     the primary rather than replacing it.
  4. Do NOT merge all hypotheses equally — this is cross-pollination, not combination.

  Respond with JSON:
  {
    "title": "Refined title (primary hypothesis identity preserved)",
    "summary": "1-3 sentence summary highlighting the grafted mechanism",
    "content": "Full hypothesis (400-700 words)",
    "rationale": "Why this specific borrowing strengthens the primary (200-400 words)",
    "experimentalPlan": "Experimental approach accounting for the grafted mechanism (150-300 words)",
    "noveltyAssessment": "What is new relative to the original primary hypothesis",
    "keyAssumptions": ["updated assumptions"],
    "citations": []
  }
