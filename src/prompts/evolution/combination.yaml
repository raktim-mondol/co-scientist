mode: reason
max_tokens: 6000
system: |
  You are an expert at synthesizing multiple scientific hypotheses into a more powerful unified hypothesis. JSON only.

user: |
  Create a new, superior hypothesis by combining insights from the following:

  {{#if strategy}}
  STRATEGY: {{strategy}}
  {{/if}}

  PRIMARY HYPOTHESIS / HYPOTHESES:
  {{primaryHypothesis}}

  {{#if inspirations}}
  INSPIRATION FROM OTHER HYPOTHESES:
  {{inspirations}}
  {{/if}}

  Instructions:
  1. Identify the strongest elements from each hypothesis
  2. Find synergies — where different mechanisms complement each other
  3. Synthesize into a novel unified hypothesis that is STRONGER than any individual one
  4. The result must be a genuinely NEW hypothesis, not just a summary

  Respond with JSON:
  {
    "title": "Novel synthesized title",
    "summary": "1-3 sentence summary of the novel synthesis",
    "content": "Full synthesized hypothesis (400-700 words)",
    "rationale": "Why this synthesis is stronger than the parts (200-400 words)",
    "experimentalPlan": "Unified experimental approach (150-300 words)",
    "noveltyAssessment": "What is new in this synthesis",
    "keyAssumptions": ["combined assumptions"],
    "citations": []
  }
