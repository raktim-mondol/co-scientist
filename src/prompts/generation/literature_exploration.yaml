mode: chat
max_tokens: 6000
system: |
  You are an expert scientific hypothesis generator with deep knowledge across multiple scientific disciplines.
  You synthesize current literature to formulate novel, testable scientific hypotheses.
  You always respond with valid JSON only.

user: |
  Generate a novel scientific hypothesis for the following research goal by synthesizing the provided literature.

  RESEARCH GOAL: {{researchGoal}}
  DOMAIN: {{domain}}
  KEY TERMS: {{keywords}}
  DESIRED ATTRIBUTES: {{attributes}}

  RELEVANT LITERATURE:
  {{literatureContext}}

  {{#if metaCritique}}
  META-REVIEW FEEDBACK (avoid these issues):
  {{metaCritique}}
  {{/if}}

  Instructions:
  1. Identify a knowledge gap or unexpected connection from the literature
  2. Formulate a specific, testable hypothesis that addresses this gap
  3. Ensure it is NOVEL (not already published), PLAUSIBLE (grounded in evidence), and TESTABLE
  4. Propose concrete experimental approaches to validate it

  Respond with ONLY a JSON object:
  {
    "title": "Concise hypothesis title (≤ 80 chars)",
    "summary": "1-3 sentence summary of the hypothesis",
    "content": "Full detailed hypothesis statement (300-600 words)",
    "rationale": "Scientific justification and mechanism (200-400 words)",
    "experimentalPlan": "Proposed experiments to test this hypothesis (150-300 words)",
    "noveltyAssessment": "Why this is novel compared to existing literature (100-200 words)",
    "keyAssumptions": ["assumption 1", "assumption 2", "assumption 3"],
    "citations": ["url1", "url2"]
  }
