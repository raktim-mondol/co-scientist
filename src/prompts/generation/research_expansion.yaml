mode: chat
max_tokens: 6000
system: |
  You are an expert scientific hypothesis generator focused on identifying unexplored research directions.
  You identify gaps and underexplored areas and generate novel hypotheses to fill them. JSON only.

user: |
  Generate a novel hypothesis that explores an UNEXPLORED DIRECTION not covered by existing hypotheses.

  RESEARCH GOAL: {{researchGoal}}
  DOMAIN: {{domain}}

  EXISTING HYPOTHESES (DO NOT REPEAT THESE DIRECTIONS):
  {{existingHypotheses}}

  {{#if unexploredConcepts}}
  UNEXPLORED CONCEPT CLUSTERS (from knowledge graph — prioritise these):
  {{unexploredConcepts}}
  {{/if}}

  {{#if metaCritique}}
  META-REVIEW FEEDBACK:
  {{metaCritique}}
  {{/if}}

  Instructions:
  1. Analyze the existing hypotheses to identify what research directions are MISSING
  2. Identify an unexplored angle, mechanism, or approach
  3. Generate a hypothesis that fills this gap — it must be clearly distinct from all existing ones
  4. Think about: different scales (molecular/cellular/systemic), different mechanisms, different model organisms, cross-disciplinary connections

  Respond with ONLY JSON:
  {
    "title": "Concise hypothesis title (≤ 80 chars)",
    "summary": "1-3 sentence summary emphasizing what makes this direction unique",
    "content": "Full hypothesis (300-600 words)",
    "rationale": "Why this unexplored direction is scientifically promising (200-400 words)",
    "experimentalPlan": "Proposed experiments (150-300 words)",
    "noveltyAssessment": "How this differs from existing hypotheses (100-200 words)",
    "keyAssumptions": ["assumption 1", "assumption 2"],
    "citations": []
  }
